# Default configuration for the data pipeline (Phase 1).
# Copy this file (e.g. configs/dev.yaml) to experiment without editing the default.

seed: 42

data:
  # Path to the IBM AML CSV downloaded from Kaggle (HI-Small_Trans.csv).
  raw_csv: data/raw/HI-Small_Trans.csv
  # Laundering attempts file, used ONLY to report recall per pattern (fan-in, cycle, ...).
  # null = look for *_Patterns.txt next to raw_csv; skipped if it does not exist.
  patterns_txt: null
  # Drop transactions at or after this time (null = keep all). HI-Small's normal activity ends
  # on 2022-09-10; Sept 11-18 hold ~1,100 transactions, ~59% laundering, all in the test split.
  end_time: "2022-09-11 00:00"
  # Optional: use only the first N rows while developing (null = use everything).
  nrows: null
  processed_dir: data/processed
  partitions_dir: data/partitions

split:
  # Chronological split. Fractions are of the time-sorted transactions.
  train_frac: 0.6
  val_frac: 0.2      # test = the remainder

features:
  # Window for the "burstiness" features (number of txns in the last N hours).
  burst_window_hours: 24
  # Amount (in USD) at or above which a payment is considered "round" if divisible by 100.
  round_amount_min: 100

partition:
  num_clients: 5
  # "group": assign every From-Bank ID to one of num_clients institutions (uses all data).
  # "top":   keep only the num_clients largest banks (drops the rest).
  mode: group
  # Display names for the dashboard only (client_i keeps its ID everywhere else). The names are
  # illustrative: every figure shown under them comes from the synthetic IBM AML data, and the
  # dashboard says so on every screen.
  bank_names:
    client_0: Axis
    client_1: HDFC
    client_2: SBI
    client_3: ICICI
    client_4: Kotak

mlp:
  # PyTorch BankModel training. Baselines train up to max_epochs and keep the epoch with the
  # best validation PR-AUC (stop after `patience` epochs without improvement). FL reuses lr and
  # batch_size; its epochs are fl.local_epochs per round.
  max_epochs: 60
  patience: 8
  lr: 0.001
  batch_size: 512

fl:
  # Federated learning (scripts/run_fl.py). mode: naive = whole model on core_features;
  # zero_filled = whole model on the union of all banks' columns (0 + missing flag where absent);
  # encoder_head = private encoder per bank on its full schema, only the head is averaged;
  # hybrid = shared core-feature encoder + private encoder for own columns + shared head.
  mode: naive
  num_rounds: 100   # val PR-AUC (encoder_head, HI-Small) flattens after ~70 rounds
  local_epochs: 1

profiles:
  enabled: true
  # How strongly synthetic customer attributes depend on laundering labels.
  # 0.0 = pure noise (use for the ablation), keep small (<= 0.2) for the main runs.
  label_signal: 0.1

# Transaction fields every bank sees for its own payments, so every client gets them.
# Naive FedAvg (the FL baseline) uses only these. Names must match TXN_FEATURES.
core_features: [log_amount, payment_format, payment_currency, receiving_currency, cross_currency,
                cross_bank, is_round, hour, dayofweek]

# What each bank computes and stores on top of the core: account-history features and
# synthetic profile columns. This is what makes the schemas heterogeneous. Names must match
# the feature pool (src/aml_fl/features.py: TXN_FEATURES) and the profile columns
# (src/aml_fl/profiles.py).
schemas:
  client_0:
    features: [src_txn_count, src_amount_mean, src_amount_std, src_fan_out, src_num_currencies,
               src_secs_since_prev]
    profile:  [account_age_days, customer_type, kyc_risk_level]
  client_1:
    features: [src_txn_count, src_fan_out, dst_fan_in, dst_received_volume, dst_burst]
    profile:  [occupation_category, declared_annual_income, branch_region]
  client_2:
    features: [src_txn_count, src_amount_mean, src_amount_std, src_fan_out, src_num_currencies,
               src_secs_since_prev, src_burst, dst_fan_in, dst_received_volume, dst_burst]
    profile:  [account_type, num_linked_accounts, onboarding_channel]
  client_3:
    features: [src_txn_count, src_amount_mean, src_secs_since_prev, src_burst, dst_fan_in, dst_burst]
    profile:  [account_age_days, declared_annual_income, onboarding_channel]
  client_4:
    features: [src_fan_out, src_num_currencies, dst_fan_in, dst_received_volume]
    profile:  [customer_type, kyc_risk_level, num_linked_accounts]
