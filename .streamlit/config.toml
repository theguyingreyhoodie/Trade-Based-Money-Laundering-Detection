# The dashboard's chart colours are chosen for a light surface, so the light theme is pinned.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
